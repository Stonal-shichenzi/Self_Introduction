                <h1 style="margin:5px;">石印社</h1>
                <hr style="margin:0px 5px;">
                <p style="margin:5px;">石印社，全称<b>石辰子印刷社</b>(Stonal's Printing Press)，是石辰子用于刊行<a href="../konodu/main.html">《学识报》</a>刊物与其它书籍的出版社，但视频则由石辰子本人而非石印社发布。</p>
                <h2 style="margin:5px;">出版社的定义</h2>
                <p style="margin:5px;"><b>出版社</b>(Publishing House / Press)是值向公众提供用抄写、印刷或其他任何方法复制的书籍、地图、版画、照片、歌篇或其他作品的组织机构。</p>
