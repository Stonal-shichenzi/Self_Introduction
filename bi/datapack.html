                <hr style="margin:0px 5px;">
                <p style="margin:5px;"><b>毕导没毕我有毕·数据包还原扩充计划</b>是指<a href="../datapack/imitate.html">还原数据包</a>（尤其是<a href="https://space.bilibili.com/3537122319403020">@MC的小方块</a>的数据包）与对<a href="../datapack/madv_plus.html">More Advancements Plus</a>进行开发而形成的系列。</p>
                <h2 style="margin:5px;">视频内容</h2>
                <p style="margin:5px;">本系列的<a href="https://www.bilibili.com/video/BV1K2AizBEvq/">第一期</a>还原了<a href="https://space.bilibili.com/3537122319403020">@MC的小方块</a>的棉花糖，而<a href="https://www.bilibili.com/video/BV1wQSSBvEFe/">第二期</a>开启了<b>特长视频</b>的制作。<a href="https://www.bilibili.com/video/BV1GL9eBUEYh/">第三期</a>是潮涌之力的还原第一部分，<a href="https://www.bilibili.com/video/BV1ENRMBWEp1/">第四期</a>继续开发了<a href="../datapack/madv_plus.html">More Advancements Plus</a>，之后的<a href="https://www.bilibili.com/video/BV1YE9fBXEHu/">第五期</a>与<a href="https://www.bilibili.com/video/BV1N1LJ6MEaZ/">第六期</a>分别是潮涌之力数据包的第二与第三部分。<a href="https://www.bilibili.com/video/BV1SGGa6qEG1/">第七期</a>与<a href="https://www.bilibili.com/video/BV1THGe6gEHL/">第八期</a>都为<a href="../datapack/madv_plus.html">More Advancements Plus</a>添加了一些语言。<a href="https://www.bilibili.com/video/BV1LNGo6JE5b/">第九期</a>添加了两个挑战进度。<a href="https://www.bilibili.com/video/BV1y9Vp6rEy2/">第十期</a>添加了道本语。</p>
